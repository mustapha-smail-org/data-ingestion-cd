# App config for the production environment, mounted by deploy.yml's
# push-config job at /etc/secrets/application.yaml on Render.

spring:
  env:
    active: production
  application:
    name: data-ingestion
log:
  level:
    root: INFO
    app: INFO
app:
  kafka:
    bootstrap-servers: "%%SECRET:KAFKA_BOOTSTRAP_SERVERS%%"
    username: "%%SECRET:KAFKA_USERNAME%%"
    password: "%%SECRET:KAFKA_PASSWORD%%"
    sasl-mechanism: SCRAM-SHA-256

    topic:
      events: "%%SECRET:KAFKA_EVENTS_TOPIC%%"

    schema-registry:
      url: "%%SECRET:SCHEMA_REGISTRY_URL%%"
      username: "%%SECRET:SCHEMA_REGISTRY_USERNAME%%"
      password: "%%SECRET:SCHEMA_REGISTRY_PASSWORD%%"
      auto-register-schemas: true
api:
  opendata:
    paris:
      base-url: https://opendata.paris.fr
      dataset-id: que-faire-a-paris-
      whereClause: ""
ingestion:
  schedule:
    cron: "0 0 4 * * *" # at 4 AM every day
    zone: "Europe/Paris"
