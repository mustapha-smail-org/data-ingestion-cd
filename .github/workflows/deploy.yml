name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [dev, staging, production]
      image_digest:
        description: 'Immutable OCI image digest (sha256:...)'
        required: true
        type: string
      source_commit:
        description: 'Source commit SHA the image was built from'
        required: true
        type: string
      image_tag:
        description: 'Human-readable tag for this deployment (sha-xxxxxxx or vX.Y.Z)'
        required: true
        type: string
      health_check_url:
        description: 'Optional base URL for post-deploy health verification'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: cd-state-data-ingestion-${{ inputs.environment }}
  cancel-in-progress: ${{ inputs.environment == 'dev' }}

jobs:
  update-desired-state:
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.read.outputs.image_repository }}
    steps:
      - name: Obtain GitHub App token
        id: app-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate digest format
        run: |
          if [[ ! "${{ inputs.image_digest }}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::image_digest must be an immutable sha256 digest, got: ${{ inputs.image_digest }}"
            exit 1
          fi

      - name: Update environment desired state
        env:
          ENV_FILE: environments/${{ inputs.environment }}.yaml
        run: |
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::No such environment file: $ENV_FILE"
            exit 1
          fi
          sed -i.bak -E \
            -e "s|^(  tag: ).*|\1${{ inputs.image_tag }}|" \
            -e "s|^(  digest: \").*(\")$|\1${{ inputs.image_digest }}\2|" \
            -e "s|^(  commit: \").*(\")$|\1${{ inputs.source_commit }}\2|" \
            "$ENV_FILE"
          rm -f "${ENV_FILE}.bak"
          cat "$ENV_FILE"

      - name: Read image repository
        id: read
        run: |
          IMAGE_REPO=$(grep -E '^\s*imageRepository:' service.yaml | sed -E 's/^\s*imageRepository:\s*//')
          echo "image_repository=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

      - name: Commit desired state
        run: |
          git config user.name "city-pulse-automation"
          git config user.email "automation@citypulse.local"
          git add environments/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(${{ inputs.environment }}): deploy data-ingestion ${{ inputs.image_tag }}"
            git push
          fi

  push-config:
    needs: update-desired-state
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve and push config file to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ inputs.environment == 'dev' && secrets.RENDER_SERVICE_ID_DEV || inputs.environment == 'staging' && secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID_PRODUCTION }}
          CONFIG_FILE: config/application-${{ inputs.environment }}.yaml
          CONFIG_FILE_NAME: application.yaml
          # External secrets:
          SECRET_KAFKA_BOOTSTRAP_SERVERS: ${{ inputs.environment == 'production' && secrets.KAFKA_BOOTSTRAP_SERVERS_PRD || secrets.KAFKA_BOOTSTRAP_SERVERS_HRP }}
          SECRET_KAFKA_USERNAME: ${{ inputs.environment == 'production' && secrets.KAFKA_USERNAME_PRD || secrets.KAFKA_USERNAME_HRP }}
          SECRET_KAFKA_PASSWORD: ${{ inputs.environment == 'production' && secrets.KAFKA_PASSWORD_PRD || secrets.KAFKA_PASSWORD_HRP }}
          SECRET_KAFKA_EVENTS_TOPIC: ${{ inputs.environment == 'production' && secrets.KAFKA_EVENTS_TOPIC_PRD || secrets.KAFKA_EVENTS_TOPIC_HRP }}
          SECRET_SCHEMA_REGISTRY_URL: ${{ inputs.environment == 'production' && secrets.SCHEMA_REGISTRY_URL_PRD || secrets.SCHEMA_REGISTRY_URL_HRP }}
          SECRET_SCHEMA_REGISTRY_USERNAME: ${{ inputs.environment == 'production' && secrets.SCHEMA_REGISTRY_USERNAME_PRD || secrets.SCHEMA_REGISTRY_USERNAME_HRP }}
          SECRET_SCHEMA_REGISTRY_PASSWORD: ${{ inputs.environment == 'production' && secrets.SCHEMA_REGISTRY_PASSWORD_PRD || secrets.SCHEMA_REGISTRY_PASSWORD_HRP }}
        run: |
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "No config file for environment '${{ inputs.environment }}' (${CONFIG_FILE}), skipping."
            exit 0
          fi

          RESOLVED=$(cat "$CONFIG_FILE")
          for VAR_NAME in $(compgen -v | grep '^SECRET_'); do
            TOKEN_NAME="${VAR_NAME#SECRET_}"
            VALUE="${!VAR_NAME}"
            RESOLVED="${RESOLVED//%%SECRET:${TOKEN_NAME}%%/${VALUE}}"
          done

          if echo "$RESOLVED" | grep -q '%%SECRET:'; then
            echo "::error::Unresolved %%SECRET:...%% placeholder(s) remain in ${CONFIG_FILE} — check that a matching SECRET_<NAME> env var is declared in this step"
            exit 1
          fi

          if [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::No RENDER_SERVICE_ID_* secret configured for environment '${{ inputs.environment }}'"
            exit 1
          fi

          PAYLOAD=$(jq -n --arg content "$RESOLVED" '{content: $content}')
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/secret-files/${CONFIG_FILE_NAME}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render secret-file API returned HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

          echo "Pushed config file '${CONFIG_FILE_NAME}' to Render service"

      - name: Push CA certificate to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ inputs.environment == 'dev' && secrets.RENDER_SERVICE_ID_DEV || inputs.environment == 'staging' && secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID_PRODUCTION }}
          CA_CERTIFICATE: ${{ inputs.environment == 'production' && secrets.KAFKA_CA_CERTIFICATE_PRD || secrets.KAFKA_CA_CERTIFICATE_HRP }}
        run: |
          if [ -z "$CA_CERTIFICATE" ]; then
            echo "No KAFKA_CA_CERTIFICATE_* secret configured for environment '${{ inputs.environment }}', skipping."
            exit 0
          fi

          PAYLOAD=$(jq -n --arg content "$CA_CERTIFICATE" '{content: $content}')
          RESPONSE=$(curl -sS -w "\n%{http_code}" -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/secret-files/ca.pem" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Render secret-file API returned HTTP ${HTTP_CODE}: ${BODY}"
            exit 1
          fi

          echo "Pushed CA certificate to Render service"

  deploy:
    needs: [update-desired-state, push-config]
    uses: mustapha-smail-org/deployment-workflows/.github/workflows/deploy-render.yml@main
    with:
      service-name: data-ingestion
      environment: ${{ inputs.environment }}
      image-repository: ${{ needs.update-desired-state.outputs.image-repository }}
      image-digest: ${{ inputs.image_digest }}
      health-check-url: ${{ inputs.health_check_url }}
    secrets:
      render-api-key: ${{ secrets.RENDER_API_KEY }}
      service-id: ${{ inputs.environment == 'dev' && secrets.RENDER_SERVICE_ID_DEV || inputs.environment == 'staging' && secrets.RENDER_SERVICE_ID_STAGING || secrets.RENDER_SERVICE_ID_PRODUCTION }}
